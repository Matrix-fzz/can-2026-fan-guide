<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAN 2025 Morocco - Fan Guide</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="#" class="logo">CAN 2025 Guide</a>
            <ul class="nav-links">
                <li><a href="#matches">Matches</a></li>
                <li><a href="#search-section">Find Your City</a></li>
                <li><a href="#cities-section">Host Cities</a></li>
            </ul>
        </div>
    </nav>

    <header id="matches" class="slider-container">
        <div class="slider">
            <!-- Slides will be injected by JavaScript -->
        </div>
        <button class="slider-btn prev">&#10094;</button>
        <button class="slider-btn next">&#10095;</button>
    </header>

    <main class="container">
        <section id="search-section">
            <div class="search-wrapper">
                <h2>Your Ultimate City Guide</h2>
                <p>Enter a team or city to instantly find your guide to hotels, food, and transport.</p>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="e.g., Senegal or Marrakesh">
                    <button id="search-button"><i class="fas fa-search"></i> Search</button>
                </div>
            </div>
        </section>

        <section id="cities-section">
            <!-- City cards will be injected here by JavaScript -->
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 CAN Fan Guide. Your Adventure Awaits!</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
